<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Staff Payroll System</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body class="auth-body">
    <main class="login-card">
        <div class="login-brand">
            <div class="login-logo">&#8358;</div>
            <h1>Staff Payroll System</h1>
            <p>Wamise Tech &middot; Static Demo</p>
        </div>

        <form id="demo-login-form" autocomplete="off">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="hint">Demo credentials: <strong>admin</strong> / <strong>admin123</strong></p>
        <p class="hint"><a href="index.html">&larr; Back to home</a></p>
    </main>
    <script src="assets/js/demo.js"></script>
</body>
</html>
